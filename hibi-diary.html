<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hibi 日々の記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --side:#F8F9FA;
  --ink:#2A2E33;
  --ink-2:#5B626A;
  --ink-3:#979EA6;
  --line:#ECEEF0;
  --rule:#E2EAF3;
  --rule-strong:#CBD7E4;
  --accent:#34537A;
  --accent-deep:#26405F;
  --accent-soft:#EDF2F8;
  --sun:#B4574F;
  --danger:#B0504A;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic",sans-serif;
  --fs-body:17px;
  --lh-body:34px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default;opacity:.35}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
svg{flex-shrink:0}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--side) 267px,var(--line) 267px 268px,var(--paper) 268px)}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:32px 24px 28px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--mincho);font-size:32px;font-weight:600;letter-spacing:.01em;line-height:1}
.logo-sub{font-size:12px;color:var(--ink-3);letter-spacing:.14em}
.btn-write{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:23px;background:var(--accent);color:#fff;font-weight:500;letter-spacing:.06em;transition:background .2s}
.btn-write:hover{background:var(--accent-deep)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink-2);text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:rgba(52,83,122,.06);color:var(--ink)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-3);transition:border-color .15s}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--ink-3)}
.search:focus-within{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{text-align:center}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--mincho);font-size:26px;font-weight:500;line-height:1.25}
.stat span{font-size:11px;color:var(--ink-3)}
.side-more summary{display:none}
.side-more-in{display:flex;flex-direction:column;gap:26px}
.side h4{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.08em}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;color:var(--ink-2);background:#fff;border:1px solid var(--line);transition:border-color .15s,color .15s}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.tag.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tag small{font-size:11px;opacity:.55}
.muted{margin:0;font-size:12px;color:var(--ink-3);line-height:1.8}
.data{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:13px}
.data button{padding:5px 0;color:var(--ink-2)}
.data button:hover{color:var(--accent)}
.data button.danger:hover{color:var(--danger)}

/* ---------- main ---------- */
.main{padding:64px clamp(20px,5vw,80px) 140px;max-width:900px;width:100%;margin:0 auto}

.hero{margin-bottom:8px}
.hero-sub{margin:0;font-size:13px;color:var(--ink-3);letter-spacing:.14em}
.hero-date{margin:4px 0 28px;font-family:var(--mincho);font-weight:500;font-size:clamp(48px,7.4vw,80px);line-height:1.12;letter-spacing:.01em}
.prompt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 4px;border-bottom:1px solid var(--rule-strong);font-family:var(--mincho);font-size:19px;color:var(--ink-3);text-align:left;transition:color .2s,border-color .2s}
.prompt:hover{color:var(--accent);border-color:var(--accent)}
.prompt-rule{height:52px;border-bottom:1px solid var(--rule)}
.prompt-rule.r2{opacity:.5}
.intro .hero-sub,.intro .hero-date{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.intro .hero-date{animation-delay:.06s}
.intro .prompt,.intro .prompt-rule{animation:fade .9s .3s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.filter-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding-bottom:4px}
.filter-head h1{margin:0;font-family:var(--mincho);font-size:26px;font-weight:500;line-height:1.5}
.filter-head p{margin:0;color:var(--ink-3);font-size:13px}
.filter-head .ghost{margin-left:auto}

.month{margin-top:64px}
.filter-head + .month{margin-top:32px}
.month-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 8px 12px;border-bottom:1px solid var(--rule-strong)}
.month-head h2{margin:0;display:flex;align-items:baseline;gap:10px;font-weight:400}
.mh-m{font-family:var(--mincho);font-size:28px;font-weight:500}
.mh-y{font-size:13px;color:var(--ink-3);letter-spacing:.1em}
.mh-count{font-size:12px;color:var(--ink-3)}

.entry{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:22px;align-items:start;padding:26px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.entry.no-photo{grid-template-columns:64px minmax(0,1fr)}
.entry:hover{background:#FAFBFC}
.e-date{text-align:center;padding-top:2px}
.e-day{display:block;font-family:var(--mincho);font-size:36px;line-height:1;font-weight:500}
.e-wd{display:block;margin-top:8px;font-size:12px;color:var(--ink-3)}
.sun .e-day{color:var(--sun)}
.sat .e-day{color:var(--accent)}
.e-title{margin:0 0 6px;font-family:var(--mincho);font-size:20px;font-weight:600;line-height:1.5}
.e-excerpt{margin:0;color:var(--ink-2);font-size:14px;line-height:1.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.e-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--ink-3)}
.meta-w,.meta-m{display:inline-flex;align-items:center;gap:5px}
.meta-m i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.meta-tag{font-size:12px;color:var(--ink-3)}
.meta-tag:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.e-thumb{width:116px;height:116px;object-fit:cover;border-radius:4px;display:block;background:var(--side)}

.empty{padding:72px 0 40px;text-align:center;color:var(--ink-2)}
.empty p{margin:0}
.empty-title{font-family:var(--mincho);font-size:22px;color:var(--ink);margin-bottom:8px!important}
.empty .btn-primary{margin-top:24px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:10px}
.cal-h{margin:0;display:flex;align-items:baseline;gap:12px;font-weight:400}
.cal-h .cm{font-family:var(--mincho);font-size:clamp(40px,6vw,60px);font-weight:500;line-height:1.1}
.cal-h .cy{font-size:14px;color:var(--ink-3);letter-spacing:.1em}
.cal-ctrl{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);transition:border-color .15s,color .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-sum{margin:0 0 24px;font-size:13px;color:var(--ink-3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-wd{padding:8px 0;font-size:12px;color:var(--ink-3);text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--side)}
.cal-wd.sun{color:var(--sun)}
.cal-wd.sat{color:var(--accent)}
.cal-cell,.cal-blank{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:104px}
.cal-blank{background:repeating-linear-gradient(135deg,transparent 0 6px,#F4F5F7 6px 7px)}
.cal-cell{position:relative;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow:hidden;background:#fff;background-size:cover;background-position:center;transition:background-color .15s}
.cal-cell:hover{background-color:#F7F9FB}
.cal-cell > *{position:relative;z-index:1}
.cal-num{font-family:var(--mincho);font-size:16px;line-height:28px;width:28px;height:28px;text-align:center;border-radius:50%}
.cal-cell.sun .cal-num{color:var(--sun)}
.cal-cell.sat .cal-num{color:var(--accent)}
.cal-cell.today .cal-num{background:var(--accent);color:#fff}
.cal-info{display:flex;align-items:flex-start;gap:6px;min-width:0}
.cal-dot{flex:0 0 8px;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--c)}
.cal-title{font-size:11.5px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.cal-more{font-size:11px;color:var(--ink-3);margin-left:auto;flex-shrink:0}
.cal-cell.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,26,34,.55),rgba(20,26,34,.05) 70%);z-index:0}
.cal-cell.photo .cal-num,.cal-cell.photo .cal-title,.cal-cell.photo .cal-more{color:#fff}
.cal-cell.photo.today .cal-num{background:#fff;color:var(--accent)}

/* ---------- buttons ---------- */
.ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;color:var(--ink-2);font-size:14px;transition:background .15s,color .15s}
.ghost:hover{background:#F2F4F6;color:var(--ink)}
.ghost.danger:hover{color:var(--danger);background:#FBF1F0}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 22px;border-radius:20px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;letter-spacing:.04em;transition:background .15s}
.btn-primary:hover{background:var(--accent-deep)}
.btn-primary.btn-danger{background:var(--danger)}
.btn-primary.btn-danger:hover{background:#963F3A}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;animation:ovIn .3s cubic-bezier(.2,.7,.2,1)}
@keyframes ovIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ov-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(12px,3vw,32px);background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ov-actions{display:flex;align-items:center;gap:6px}
.ed-status{font-size:12px;color:var(--ink-3)}
.page{max-width:720px;margin:0 auto;padding:56px 24px 140px}

.ruled{font-family:var(--mincho);font-size:var(--fs-body);line-height:var(--lh-body);background-image:linear-gradient(to bottom,transparent calc(var(--lh-body) - 1px),var(--rule) calc(var(--lh-body) - 1px));background-size:100% var(--lh-body);background-repeat:repeat-y}

/* reader */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--rule-strong);margin-bottom:32px}
.page-date{display:flex;align-items:center;gap:16px}
.pd-day{font-family:var(--mincho);font-size:68px;line-height:1;font-weight:500}
.pd-ym{display:block;font-size:14px;color:var(--ink-2)}
.pd-wd{display:block;font-size:13px;color:var(--ink-3)}
.page-head .e-meta{margin:0 0 4px;font-size:13px}
.page-title{font-family:var(--mincho);font-size:30px;font-weight:600;line-height:1.5;margin:0 0 30px}
.page-photo{margin:0 0 36px}
.page-photo img{width:100%;max-height:min(58vh,480px);object-fit:cover;border-radius:4px;display:block}
.page-body{white-space:pre-wrap;word-break:break-word;min-height:calc(var(--lh-body) * 5)}
.page-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:36px}
.page-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:72px;padding-top:20px;border-top:1px solid var(--line)}
.pn{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:10px;text-align:left;min-width:0;transition:background .15s}
.pn.next{text-align:right;align-items:flex-end}
.pn:hover{background:#F5F7F9}
.pn-dir{font-size:12px;color:var(--ink-3)}
.pn-t{font-family:var(--mincho);font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* editor */
.ed-date{position:relative;display:inline-block}
.ed-date-btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--mincho);font-size:22px;font-weight:500;color:var(--ink);padding:2px 0;transition:color .15s}
.ed-date-btn:hover{color:var(--accent)}
.ed-date-btn svg{color:var(--ink-3)}
.ed-date input{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.ed-date.fallback input{position:static;width:auto;height:auto;opacity:1;pointer-events:auto;margin-left:12px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:14px}
.ed-pickers{display:flex;flex-wrap:wrap;align-items:center;gap:14px 36px;margin:22px 0 34px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.picker{display:flex;align-items:center;gap:4px}
.picker-label{font-size:12px;color:var(--ink-3);margin-right:8px}
.w-opt{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);border:1px solid transparent;transition:all .15s}
.w-opt:hover{color:var(--ink);background:#F3F5F7}
.w-opt[aria-checked="true"]{color:var(--accent);background:var(--accent-soft);border-color:#CFDBE8}
.m-opt{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;transition:box-shadow .15s}
.m-opt i{width:14px;height:14px;border-radius:50%;background:var(--c);transition:transform .15s}
.m-opt:hover i{transform:scale(1.15)}
.m-opt[aria-checked="true"]{box-shadow:inset 0 0 0 1.5px var(--c)}
.m-opt[aria-checked="true"] i{transform:scale(1.2)}
.m-name{font-size:12px;color:var(--ink-2);margin-left:6px;min-width:5em}
.ed-title{display:block;width:100%;border:0;outline:0;font-family:var(--mincho);font-size:30px;font-weight:600;line-height:1.5;padding:0;margin:0 0 26px;background:transparent}
.ed-title::placeholder,.ed-body::placeholder,.ed-tags input::placeholder{color:#C3C9CF}
.ed-photo-add{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px dashed #C9D2DB;border-radius:10px;color:var(--ink-2);font-size:13px;margin-bottom:30px;transition:border-color .15s,color .15s}
.ed-photo-add:hover{border-color:var(--accent);color:var(--accent)}
.ed-photo-prev{position:relative;margin-bottom:34px}
.ed-photo-prev img{width:100%;max-height:440px;object-fit:cover;border-radius:4px;display:block}
.ed-photo-acts{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.ed-photo-acts button{background:rgba(255,255,255,.94);padding:6px 14px;border-radius:16px;font-size:12px;color:var(--ink);box-shadow:0 1px 4px rgba(30,40,55,.12)}
.ed-photo-acts button:hover{color:var(--accent)}
.ed-body{display:block;width:100%;border:0;outline:0;resize:none;padding:0;margin:0;min-height:calc(var(--lh-body) * 12);background-color:transparent;background-attachment:local;overflow:hidden}
.ed-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:30px;padding:12px 0 10px;border-top:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.chip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1;color:var(--accent)}
.chip button:hover{background:rgba(52,83,122,.12)}
.ed-tags input::-webkit-calendar-picker-indicator{display:none!important}
.ed-tags input{flex:1;min-width:12em;border:0;outline:0;padding:6px 4px;font-size:14px;background:transparent}
.ed-foot{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:12px;color:var(--ink-3)}

/* dialog & toast */
.dialog-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(40,46,54,.26);padding:20px;animation:fade .15s both}
.dialog{background:#fff;border-radius:16px;padding:26px 24px 20px;max-width:380px;width:100%;box-shadow:0 24px 60px rgba(30,40,55,.18)}
.dialog p{margin:0 0 22px;line-height:1.9;white-space:pre-line}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;line-height:1.6;z-index:90;transition:opacity .25s,transform .25s;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.fab{display:none;position:fixed;right:20px;bottom:24px;z-index:40;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;place-items:center;box-shadow:0 8px 24px rgba(38,64,95,.3)}
body.locked .fab{display:none!important}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .app{background:var(--paper)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 20px 14px;gap:14px}
  .btn-write{display:none}
  .nav{flex-direction:row}
  .nav button{flex:1;justify-content:center}
  .stats{padding:10px 0}
  .stat b{font-size:22px}
  .side-more summary{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;list-style:none;padding:2px 0}
  .side-more summary::-webkit-details-marker{display:none}
  .side-more summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
  .side-more[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
  .side-more-in{padding-top:16px;gap:20px}
  .main{padding:36px 20px 140px}
  .entry,.entry.no-photo{grid-template-columns:44px minmax(0,1fr);gap:14px;padding:22px 4px}
  .entry .e-thumb{grid-column:2;width:100%;height:auto;aspect-ratio:16/9;margin-top:4px}
  .e-day{font-size:28px}
  .e-title{font-size:18px}
  .fab{display:grid}
  .cal-cell,.cal-blank{min-height:64px}
  .cal-cell{padding:5px;align-items:center}
  .cal-title,.cal-more{display:none}
  .cal-dot{margin:0}
  .page{padding:36px 20px 120px}
  .pd-day{font-size:56px}
  .page-title,.ed-title{font-size:25px}
  .ed-status{display:none}
  .ed-hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">hibi</span><span class="logo-sub">日々の記録</span></div>
    <button class="btn-write" id="writeBtn"><span data-icon="pen"></span>日記を書く</button>
    <nav class="nav" aria-label="表示の切り替え">
      <button data-view="journal" class="active"><span data-icon="book"></span>日記</button>
      <button data-view="calendar"><span data-icon="cal"></span>カレンダー</button>
    </nav>
    <label class="search"><span data-icon="search"></span><input id="q" type="search" placeholder="日記を検索" autocomplete="off"></label>
    <details class="side-more" id="sideMore" open>
      <summary>記録・タグ・バックアップ</summary>
      <div class="side-more-in">
        <section class="stats" id="stats" aria-label="記録"></section>
        <section>
          <h4>タグ</h4>
          <div class="tag-list" id="tagList"></div>
        </section>
        <section>
          <h4>バックアップ</h4>
          <div class="data">
            <button id="exportBtn">バックアップを書き出す</button>
            <button id="importBtn">バックアップを読み込む</button>
            <button id="wipeBtn" class="danger">すべての日記を削除</button>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
          </div>
        </section>
      </div>
    </details>
  </aside>
  <main class="main" id="main"></main>
</div>

<button class="fab" id="fab" aria-label="日記を書く"><span data-icon="pen" data-size="24"></span></button>

<!-- reader -->
<div class="overlay" id="reader" hidden role="dialog" aria-modal="true" aria-label="日記を読む">
  <div class="ov-bar">
    <button class="ghost" id="rdClose"><span data-icon="close"></span>閉じる</button>
    <button class="ghost" id="rdEdit"><span data-icon="pen"></span>編集する</button>
  </div>
  <article class="page" id="readerPage"></article>
</div>

<!-- editor -->
<div class="overlay" id="editor" hidden role="dialog" aria-modal="true" aria-label="日記を書く">
  <div class="ov-bar">
    <button class="ghost" id="edClose"><span data-icon="close"></span>閉じる</button>
    <span class="ed-status" id="edStatus"></span>
    <div class="ov-actions">
      <button class="ghost danger" id="edDelete">削除</button>
      <button class="btn-primary" id="edSave">保存する</button>
    </div>
  </div>
  <div class="page">
    <div class="ed-date" id="edDateWrap">
      <button type="button" class="ed-date-btn" id="edDateBtn"><span id="edDateLabel"></span><span data-icon="cal"></span></button>
      <input type="date" id="edDate" aria-label="日付">
    </div>
    <div class="ed-pickers">
      <div class="picker" id="edWeather" role="radiogroup" aria-label="天気"></div>
      <div class="picker" id="edMood" role="radiogroup" aria-label="気分"></div>
    </div>
    <input class="ed-title" id="edTitle" placeholder="タイトル" maxlength="120" autocomplete="off">
    <div id="edPhoto"></div>
    <input type="file" id="edPhotoFile" accept="image/*" hidden>
    <textarea class="ed-body ruled" id="edBody" placeholder="今日あったこと、感じたこと。"></textarea>
    <div class="ed-tags">
      <div id="edTagChips" style="display:contents"></div>
      <input id="edTagInput" placeholder="タグを追加（Enterで確定）" list="tagSuggest" autocomplete="off">
      <datalist id="tagSuggest"></datalist>
    </div>
    <div class="ed-foot"><span id="edCount">0文字</span><span class="ed-hint">Ctrl + S（Macは ⌘ + S）で保存</span></div>
  </div>
</div>

<!-- dialog -->
<div class="dialog-wrap" id="dialog" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogMsg">
    <p id="dialogMsg"></p>
    <div class="dialog-actions">
      <button class="ghost" id="dialogCancel">キャンセル</button>
      <button class="btn-primary" id="dialogOk">OK</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const uid = () => { try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {} return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); };
const WD = ['日','月','火','水','木','金','土'];

const ICON = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  cloud:'<path d="M7 18.5h10.5a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.3 10.6 4 4 0 0 0 7 18.5z"/>',
  rain:'<path d="M7 14.5h10.5a3.6 3.6 0 0 0 .3-7.2A5.5 5.5 0 0 0 7 7.2a3.7 3.7 0 0 0 0 7.3z"/><path d="m8.8 17.5-1 2.6M12.8 17.5l-1 2.6M16.8 17.5l-1 2.6"/>',
  snow:'<path d="M7 14.5h10.5a3.6 3.6 0 0 0 .3-7.2A5.5 5.5 0 0 0 7 7.2a3.7 3.7 0 0 0 0 7.3z"/><g fill="currentColor" stroke="none"><circle cx="8" cy="18.2" r="1"/><circle cx="12" cy="18.2" r="1"/><circle cx="16" cy="18.2" r="1"/><circle cx="10" cy="21.2" r="1"/><circle cx="14" cy="21.2" r="1"/></g>',
  wind:'<path d="M3 8.5h10.5a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 12.5h15a2.5 2.5 0 1 1-2.5 2.5"/><path d="M3 16.5h7"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
  book:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  image:'<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 16-5-5-9 8.5"/>',
  left:'<path d="m14.5 6-6 6 6 6"/>',
  right:'<path d="m9.5 6 6 6-6 6"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
};
const icon = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
$$('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon, +(el.dataset.size || 18)); });

const MOODS = [
  { label:'とてもいい', color:'#F0C258' },
  { label:'いい',       color:'#8FC59B' },
  { label:'ふつう',     color:'#B9C3CC' },
  { label:'いまいち',   color:'#93AED4' },
  { label:'しんどい',   color:'#B79CC4' },
];
const WEATHER = {
  sun:  { label:'晴れ' },
  cloud:{ label:'くもり' },
  rain: { label:'雨' },
  snow: { label:'雪' },
  wind: { label:'風' },
};

/* ================= storage (IndexedDB) ================= */
const Store = {
  db: null, memOnly: false, mem: new Map(), metaMem: {},
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('hibi-diary', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.memOnly = true; }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  all()      { return this.memOnly ? Promise.resolve([...this.mem.values()]) : this.tx('entries', 'readonly', s => s.getAll()); },
  put(e)     { if (this.memOnly) { this.mem.set(e.id, e); return Promise.resolve(); } return this.tx('entries', 'readwrite', s => s.put(e)); },
  del(id)    { if (this.memOnly) { this.mem.delete(id); return Promise.resolve(); } return this.tx('entries', 'readwrite', s => s.delete(id)); },
  clear()    { if (this.memOnly) { this.mem.clear(); return Promise.resolve(); } return this.tx('entries', 'readwrite', s => s.clear()); },
  getMeta(k) { return this.memOnly ? Promise.resolve(this.metaMem[k]) : this.tx('meta', 'readonly', s => s.get(k)); },
  setMeta(k, v) { if (this.memOnly) { this.metaMem[k] = v; return Promise.resolve(); } return this.tx('meta', 'readwrite', s => s.put(v, k)); },
};

/* ================= state ================= */
const now0 = new Date();
const state = { entries: [], view: 'journal', q: '', tag: null, calY: now0.getFullYear(), calM: now0.getMonth() };

const sorted = () => [...state.entries].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
function filtered() {
  const q = state.q.trim().toLowerCase();
  return sorted().filter(e =>
    (!state.tag || e.tags.includes(state.tag)) &&
    (!q || `${e.title}\n${e.body}\n${e.tags.join(' ')}`.toLowerCase().includes(q)));
}
function stats() {
  const days = new Set(state.entries.map(e => e.date));
  let streak = 0;
  const d = new Date();
  if (!days.has(iso(d))) d.setDate(d.getDate() - 1);
  while (days.has(iso(d))) { streak++; d.setDate(d.getDate() - 1); }
  const ym = todayISO().slice(0, 7);
  return { total: state.entries.length, streak, month: [...days].filter(x => x.startsWith(ym)).length };
}

/* ================= render ================= */
function render() {
  renderSide();
  state.view === 'journal' ? renderJournal() : renderCalendar();
}

function renderSide() {
  const s = stats();
  $('#stats').innerHTML = `
    <div class="stat"><b>${s.total}</b><span>日記の数</span></div>
    <div class="stat"><b>${s.streak}</b><span>連続日数</span></div>
    <div class="stat"><b>${s.month}</b><span>今月書いた日</span></div>`;
  const counts = new Map();
  state.entries.forEach(e => e.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  const tags = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'));
  $('#tagList').innerHTML = tags.length
    ? tags.map(([t, c]) => `<button class="tag ${state.tag === t ? 'active' : ''}" data-tag="${esc(t)}">${esc(t)}<small>${c}</small></button>`).join('')
    : '<p class="muted">日記にタグをつけると、ここから絞り込めます。</p>';
  $('#tagSuggest').innerHTML = tags.map(([t]) => `<option value="${esc(t)}">`).join('');
  $$('.nav button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
}

function metaHTML(e, withTags) {
  const parts = [];
  if (e.weather && WEATHER[e.weather]) parts.push(`<span class="meta-w">${icon(e.weather, 16)}${WEATHER[e.weather].label}</span>`);
  if (e.mood != null && MOODS[e.mood]) parts.push(`<span class="meta-m"><i style="--c:${MOODS[e.mood].color}"></i>${MOODS[e.mood].label}</span>`);
  if (withTags) e.tags.forEach(t => parts.push(`<button class="meta-tag" data-tag="${esc(t)}">#${esc(t)}</button>`));
  return parts.length ? `<div class="e-meta">${parts.join('')}</div>` : '';
}

function entryHTML(e) {
  const d = parse(e.date), wd = d.getDay();
  return `<article class="entry ${e.photo ? '' : 'no-photo'}" tabindex="0" data-id="${esc(e.id)}">
    <div class="e-date ${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}"><span class="e-day">${d.getDate()}</span><span class="e-wd">${WD[wd]}</span></div>
    <div class="e-main">
      <h3 class="e-title">${esc(e.title || '無題')}</h3>
      ${e.body.trim() ? `<p class="e-excerpt">${esc(e.body.trim().replace(/([。！？」』）])\s+/g, '$1').replace(/\s+/g, ' ').slice(0, 240))}</p>` : ''}
      ${metaHTML(e, true)}
    </div>
    ${e.photo ? `<img class="e-thumb" src="${esc(e.photo)}" alt="" loading="lazy">` : ''}
  </article>`;
}

let firstRender = true;
function renderJournal() {
  const main = $('#main');
  const list = filtered();
  const q = state.q.trim();
  let html = '';

  if (!q && !state.tag) {
    const n = new Date(), t = todayISO();
    const hasToday = state.entries.some(e => e.date === t);
    html += `<section class="hero">
      <p class="hero-sub">${n.getFullYear()}年　${WD[n.getDay()]}曜日</p>
      <h1 class="hero-date">${n.getMonth() + 1}月${n.getDate()}日</h1>
      <button class="prompt" id="promptBtn">
        <span>${hasToday ? '今日の日記を読み返す' : '今日はどんな一日でしたか。'}</span>${icon(hasToday ? 'book' : 'pen', 20)}
      </button>
      <div class="prompt-rule" aria-hidden="true"></div><div class="prompt-rule r2" aria-hidden="true"></div>
    </section>`;
  } else {
    const label = state.tag && q ? `タグ「${esc(state.tag)}」で「${esc(q)}」を含む日記`
      : state.tag ? `タグ「${esc(state.tag)}」の日記` : `「${esc(q)}」を含む日記`;
    html += `<section class="filter-head"><h1>${label}</h1><p>${list.length}件</p><button class="ghost" id="clearFilter">${icon('close', 16)}絞り込みを解除</button></section>`;
  }

  if (!state.entries.length) {
    html += `<div class="empty"><p class="empty-title">まだ日記はありません。</p><p>今日のことを、ひとことから書いてみませんか。</p><button class="btn-primary" data-new="${todayISO()}">${icon('pen', 16)}今日の日記を書く</button></div>`;
  } else if (!list.length) {
    html += `<div class="empty"><p class="empty-title">見つかりませんでした。</p><p>別の言葉やタグで探してみてください。</p></div>`;
  } else {
    let cur = null;
    for (const e of list) {
      const ym = e.date.slice(0, 7);
      if (ym !== cur) {
        if (cur) html += '</div></section>';
        cur = ym;
        const [y, m] = ym.split('-');
        const cnt = list.filter(x => x.date.startsWith(ym)).length;
        html += `<section class="month"><header class="month-head"><h2><span class="mh-m">${+m}月</span><span class="mh-y">${y}</span></h2><span class="mh-count">${cnt}件</span></header><div class="entries">`;
      }
      html += entryHTML(e);
    }
    if (cur) html += '</div></section>';
  }

  main.innerHTML = html;
  if (firstRender) {
    firstRender = false;
    main.classList.add('intro');
    setTimeout(() => main.classList.remove('intro'), 1400);
  }
}

function renderCalendar() {
  const y = state.calY, m = state.calM;
  const lead = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const t = todayISO();
  const byDate = {};
  [...state.entries].sort((a, b) => a.createdAt - b.createdAt).forEach(e => (byDate[e.date] ||= []).push(e));

  let cells = WD.map((w, i) => `<div class="cal-wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div class="cal-blank"></div>';
  let monthDays = 0;
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
    const es = byDate[ds] || [];
    if (es.length) monthDays++;
    const ph = es.find(e => e.photo);
    const wd = (lead + d - 1) % 7;
    const first = es[0];
    const cls = ['cal-cell', es.length && 'has', ds === t && 'today', ph && 'photo', wd === 0 && 'sun', wd === 6 && 'sat'].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-date="${ds}" ${ph ? `style="background-image:url('${esc(ph.photo)}')"` : ''} aria-label="${m + 1}月${d}日${es.length ? `（日記${es.length}件）` : ''}">
      <span class="cal-num">${d}</span>
      ${first ? `<span class="cal-info">${first.mood != null ? `<i class="cal-dot" style="--c:${MOODS[first.mood].color}"></i>` : ''}<span class="cal-title">${esc(first.title || '無題')}</span>${es.length > 1 ? `<span class="cal-more">+${es.length - 1}</span>` : ''}</span>` : ''}
    </button>`;
  }
  const trail = (7 - (lead + days) % 7) % 7;
  for (let i = 0; i < trail; i++) cells += '<div class="cal-blank"></div>';

  $('#main').innerHTML = `<section class="cal">
    <header class="cal-head">
      <h1 class="cal-h"><span class="cm">${m + 1}月</span><span class="cy">${y}</span></h1>
      <div class="cal-ctrl">
        <button class="icon-btn" id="calPrev" aria-label="前の月">${icon('left')}</button>
        <button class="ghost" id="calToday">今月</button>
        <button class="icon-btn" id="calNext" aria-label="次の月">${icon('right')}</button>
      </div>
    </header>
    <p class="cal-sum">${monthDays ? `この月は ${monthDays} 日分の日記があります。` : 'この月の日記はまだありません。日付をクリックすると、その日の日記を書けます。'}</p>
    <div class="cal-grid">${cells}</div>
  </section>`;
}

/* ================= overlays ================= */
function showOverlay(sel) { const el = $(sel); el.hidden = false; el.scrollTop = 0; document.body.classList.add('locked'); }
function hideOverlay(sel) {
  $(sel).hidden = true;
  if ($('#reader').hidden && $('#editor').hidden) document.body.classList.remove('locked');
}

/* ---------- reader ---------- */
let readerId = null;
function openReader(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  readerId = id;
  const d = parse(e.date), wd = d.getDay();
  const list = sorted();
  const idx = list.findIndex(x => x.id === id);
  const newer = list[idx - 1], older = list[idx + 1];
  const short = s => { const x = parse(s); return `${x.getMonth() + 1}月${x.getDate()}日`; };
  $('#readerPage').innerHTML = `
    <header class="page-head">
      <div class="page-date ${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}">
        <span class="pd-day e-day">${d.getDate()}</span>
        <div><span class="pd-ym">${d.getFullYear()}年${d.getMonth() + 1}月</span><span class="pd-wd">${WD[wd]}曜日</span></div>
      </div>
      ${metaHTML(e, false)}
    </header>
    <h1 class="page-title">${esc(e.title || '無題')}</h1>
    ${e.photo ? `<figure class="page-photo"><img src="${esc(e.photo)}" alt=""></figure>` : ''}
    <div class="page-body ruled">${esc(e.body)}</div>
    ${e.tags.length ? `<div class="page-tags">${e.tags.map(t => `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : ''}
    <nav class="page-nav" aria-label="ほかの日記">
      ${older ? `<button class="pn prev" data-go="${esc(older.id)}"><span class="pn-dir">‹ 前の日記</span><span class="pn-t">${short(older.date)}　${esc(older.title || '無題')}</span></button>` : '<span></span>'}
      ${newer ? `<button class="pn next" data-go="${esc(newer.id)}"><span class="pn-dir">次の日記 ›</span><span class="pn-t">${short(newer.date)}　${esc(newer.title || '無題')}</span></button>` : '<span></span>'}
    </nav>`;
  $('#readerPage').dataset.older = older ? older.id : '';
  $('#readerPage').dataset.newer = newer ? newer.id : '';
  showOverlay('#reader');
}

/* ---------- editor ---------- */
const ed = { id: null, photo: null, tags: [], mood: null, weather: null, snapshot: '', fromReader: false };
const edSnap = () => JSON.stringify([$('#edDate').value, $('#edTitle').value, $('#edBody').value, ed.photo, ed.tags, ed.mood, ed.weather]);

function openEditor(entry, date, fromReader = false) {
  ed.id = entry ? entry.id : null;
  ed.fromReader = fromReader;
  ed.photo = entry ? entry.photo : null;
  ed.tags = entry ? [...entry.tags] : [];
  ed.mood = entry ? entry.mood : null;
  ed.weather = entry ? entry.weather : null;
  $('#edDate').value = entry ? entry.date : (date || todayISO());
  $('#edTitle').value = entry ? entry.title : '';
  $('#edBody').value = entry ? entry.body : '';
  $('#edTagInput').value = '';
  $('#edDelete').hidden = !entry;
  $('#edSave').textContent = entry ? '変更を保存' : '保存する';
  $('#edStatus').textContent = entry ? `最終更新 ${fmtTime(entry.updatedAt)}` : '新しい日記';
  $('#edDateWrap').classList.remove('fallback');
  renderEdDate(); renderPickers(); renderPhoto(); renderChips(); updateCount();
  showOverlay('#editor');
  ed.snapshot = edSnap();
  requestAnimationFrame(() => { autoGrow(); (entry ? $('#edBody') : $('#edTitle')).focus({ preventScroll: true }); });
}
function fmtTime(ts) { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function renderEdDate() {
  const v = $('#edDate').value || todayISO();
  const d = parse(v);
  $('#edDateLabel').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日　${WD[d.getDay()]}曜日`;
}
function renderPickers() {
  $('#edWeather').innerHTML = `<span class="picker-label">天気</span>` + Object.entries(WEATHER).map(([k, w]) =>
    `<button type="button" class="w-opt" role="radio" aria-checked="${ed.weather === k}" aria-label="${w.label}" title="${w.label}" data-w="${k}">${icon(k, 20)}</button>`).join('');
  $('#edMood').innerHTML = `<span class="picker-label">気分</span>` + MOODS.map((m, i) =>
    `<button type="button" class="m-opt" role="radio" aria-checked="${ed.mood === i}" aria-label="${m.label}" title="${m.label}" data-m="${i}" style="--c:${m.color}"><i></i></button>`).join('') +
    `<span class="m-name">${ed.mood != null ? MOODS[ed.mood].label : ''}</span>`;
}
function renderPhoto() {
  $('#edPhoto').innerHTML = ed.photo
    ? `<div class="ed-photo-prev"><img src="${esc(ed.photo)}" alt=""><div class="ed-photo-acts"><button type="button" data-ph="add">変更</button><button type="button" data-ph="remove">外す</button></div></div>`
    : `<button type="button" class="ed-photo-add" data-ph="add">${icon('image')}写真を添える</button>`;
}
function renderChips() {
  $('#edTagChips').innerHTML = ed.tags.map((t, i) => `<span class="chip">${esc(t)}<button type="button" data-rm="${i}" aria-label="タグ「${esc(t)}」を外す">×</button></span>`).join('');
}
function addTags(raw) {
  raw.split(/[,、，]+/).map(t => t.trim().replace(/^#+/, '').slice(0, 24)).filter(Boolean).forEach(t => {
    if (!ed.tags.includes(t) && ed.tags.length < 20) ed.tags.push(t);
  });
  renderChips();
}
function commitTagInput() { const i = $('#edTagInput'); if (i.value.trim()) { addTags(i.value); i.value = ''; } }
function updateCount() { $('#edCount').textContent = `${$('#edBody').value.replace(/\s/g, '').length}文字`; }
function autoGrow() {
  const ta = $('#edBody'), ov = $('#editor'), top = ov.scrollTop;
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  ov.scrollTop = top;
}

function resizeImage(file, max = 1600, quality = .82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
async function setPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;
  try { ed.photo = await resizeImage(file); renderPhoto(); }
  catch (e) { toast('この画像は読み込めませんでした。JPEGかPNGの画像を選んでください。', 4000); }
}

async function saveEditor() {
  commitTagInput();
  const title = $('#edTitle').value.trim();
  const body = $('#edBody').value.replace(/\s+$/, '');
  if (!title && !body.trim() && !ed.photo) { toast('タイトルか本文を入力してください'); $('#edTitle').focus(); return; }
  const now = Date.now();
  const prev = ed.id ? state.entries.find(e => e.id === ed.id) : null;
  const entry = {
    id: ed.id || uid(), date: $('#edDate').value || todayISO(), title, body,
    mood: ed.mood, weather: ed.weather, tags: [...ed.tags], photo: ed.photo,
    createdAt: prev ? prev.createdAt : now, updatedAt: now,
  };
  try { await Store.put(entry); }
  catch (err) { toast('保存できませんでした。写真を外してから、もう一度保存してください。', 5000); return; }
  if (prev) Object.assign(prev, entry); else state.entries.push(entry);
  ed.snapshot = edSnap();
  hideOverlay('#editor');
  render();
  openReader(entry.id);
  toast('保存しました');
}
async function closeEditor() {
  if (edSnap() !== ed.snapshot) {
    const ok = await ask('保存していない変更があります。\n変更を破棄して閉じますか？', { ok: '破棄して閉じる', danger: true });
    if (!ok) return;
  }
  hideOverlay('#editor');
  if (ed.fromReader && ed.id) openReader(ed.id);
}
async function deleteEntry(id) {
  const ok = await ask('この日記を削除しますか？\n削除すると元に戻せません。', { ok: '削除する', danger: true });
  if (!ok) return;
  try { await Store.del(id); } catch (e) { toast('削除できませんでした。もう一度お試しください。'); return; }
  state.entries = state.entries.filter(e => e.id !== id);
  if (state.tag && !state.entries.some(e => e.tags.includes(state.tag))) state.tag = null;
  hideOverlay('#editor'); hideOverlay('#reader');
  render();
  toast('削除しました');
}

/* ---------- dialog & toast ---------- */
let dialogResolve = null;
function ask(msg, { ok = 'OK', cancel = 'キャンセル', danger = false } = {}) {
  return new Promise(res => {
    $('#dialogMsg').textContent = msg;
    const okb = $('#dialogOk');
    okb.textContent = ok;
    okb.classList.toggle('btn-danger', danger);
    $('#dialogCancel').textContent = cancel;
    const back = document.activeElement;
    $('#dialog').hidden = false;
    okb.focus();
    dialogResolve = v => { $('#dialog').hidden = true; dialogResolve = null; if (back && back.focus) back.focus({ preventScroll: true }); res(v); };
  });
}
let toastTimer;
function toast(msg, ms = 2400) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- backup ---------- */
function exportData() {
  const data = { app: 'hibi', version: 1, exportedAt: new Date().toISOString(), entries: sorted() };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hibi-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast('バックアップを書き出しました');
}
function normalize(e) {
  if (!e || typeof e !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) return null;
  return {
    id: typeof e.id === 'string' && e.id ? e.id : uid(),
    date: e.date,
    title: String(e.title || '').slice(0, 200),
    body: String(e.body || ''),
    mood: Number.isInteger(e.mood) && e.mood >= 0 && e.mood < MOODS.length ? e.mood : null,
    weather: WEATHER[e.weather] ? e.weather : null,
    tags: Array.isArray(e.tags) ? [...new Set(e.tags.map(t => String(t).trim()).filter(Boolean))].slice(0, 20) : [],
    photo: typeof e.photo === 'string' && e.photo.startsWith('data:image/') ? e.photo : null,
    createdAt: +e.createdAt || Date.now(),
    updatedAt: +e.updatedAt || Date.now(),
  };
}
async function importData(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { toast('ファイルを読み込めませんでした。hibiで書き出したJSONファイルを選んでください。', 4500); return; }
  const list = (Array.isArray(data) ? data : data && data.entries);
  const clean = Array.isArray(list) ? list.map(normalize).filter(Boolean) : [];
  if (!clean.length) { toast('読み込める日記が見つかりませんでした。hibiで書き出したJSONファイルを選んでください。', 4500); return; }
  const ok = await ask(`${clean.length}件の日記を読み込みます。\n同じ日記がすでにある場合は、ファイルの内容で上書きされます。`, { ok: '読み込む' });
  if (!ok) return;
  try {
    for (const e of clean) {
      await Store.put(e);
      const i = state.entries.findIndex(x => x.id === e.id);
      if (i >= 0) state.entries[i] = e; else state.entries.push(e);
    }
  } catch (e) { toast('途中で保存できなくなりました。保存容量が足りない可能性があります。', 5000); }
  render();
  toast(`${clean.length}件の日記を読み込みました`);
}
async function wipeAll() {
  const ok = await ask('すべての日記を削除しますか？\n削除すると元に戻せません。先にバックアップを書き出しておくと安心です。', { ok: 'すべて削除', danger: true });
  if (!ok) return;
  await Store.clear();
  state.entries = []; state.tag = null; state.q = ''; $('#q').value = '';
  render();
  toast('すべての日記を削除しました');
}

/* ---------- sample content ---------- */
function samplePhoto() {
  const w = 960, h = 720, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#EDF2F1'); g.addColorStop(1, '#FBF3E8');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  let s = 11;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 16; i++) {
    const cx = r() * w, cy = r() * h, rad = 90 + r() * 170;
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    rg.addColorStop(0, 'rgba(110,145,105,.30)'); rg.addColorStop(1, 'rgba(110,145,105,0)');
    x.fillStyle = rg; x.fillRect(0, 0, w, h);
  }
  for (let i = 0; i < 70; i++) {
    const cx = r() * w, cy = r() * h, rad = 6 + r() * 36, a = .22 + r() * .5;
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    rg.addColorStop(0, `rgba(238,146,58,${a})`); rg.addColorStop(.55, `rgba(244,168,84,${a * .6})`); rg.addColorStop(1, 'rgba(244,168,84,0)');
    x.fillStyle = rg; x.beginPath(); x.arc(cx, cy, rad, 0, Math.PI * 2); x.fill();
  }
  return c.toDataURL('image/jpeg', .85);
}
function seedEntries() {
  const day = n => { const x = new Date(); x.setDate(x.getDate() - n); return iso(x); };
  const t = Date.now();
  let photo = null;
  try { photo = samplePhoto(); } catch (e) {}
  return [
    { id: uid(), date: day(1), title: '金木犀の匂い', mood: 1, weather: 'sun', tags: ['散歩', '秋'], photo,
      body: '駅までの道で、ふっと甘い匂いがした。見上げたら、オレンジ色の小さな花がびっしり咲いていた。\n\n毎年この匂いで、秋が来たことに気づく。去年も同じ場所で同じことを思った気がする。\n\n帰りにパン屋でかぼちゃのマフィンを買った。少し寄り道するだけで、一日の印象はずいぶん変わる。',
      createdAt: t - 1000, updatedAt: t - 1000 },
    { id: uid(), date: day(3), title: '雨の日の読書', mood: 2, weather: 'rain', tags: ['本', 'おうち時間'], photo: null,
      body: '朝から一日中雨。予定をぜんぶやめて、積んでいた本を一冊読み切った。\n\n窓の外の音を聞きながら、あたたかいお茶を三杯。何もしない日も、ちゃんと必要なんだと思う。',
      createdAt: t - 2000, updatedAt: t - 2000 },
    { id: uid(), date: day(8), title: 'このノートの使い方', mood: 0, weather: 'cloud', tags: ['はじめに'], photo: null,
      body: 'hibi へようこそ。ここは、日々のことを書き溜めておくための小さなノートです。\n\n・「日記を書く」ボタンか、一覧の上の「今日はどんな一日でしたか。」から書きはじめられます。\n・天気と気分、写真、タグを添えられます。タグを押すと、同じタグの日記だけを表示します。\n・「カレンダー」では、書いた日がひと目でわかります。空いている日を押すと、その日の日記を書けます。\n・日記はこのブラウザの中に保存されます。ときどき「バックアップを書き出す」で保存しておくと安心です。\n\nこのサンプルの日記は、読み終わったら削除してかまいません。',
      createdAt: t - 3000, updatedAt: t - 3000 },
  ];
}

/* ================= events ================= */
function setTag(t) {
  state.tag = state.tag === t ? null : t;
  state.view = 'journal';
  hideOverlay('#reader');
  render();
  window.scrollTo({ top: 0 });
}
function newToday() { openEditor(null, todayISO()); }

function bind() {
  $('#writeBtn').addEventListener('click', newToday);
  $('#fab').addEventListener('click', newToday);
  $$('.nav button').forEach(b => b.addEventListener('click', () => {
    state.view = b.dataset.view;
    render();
    window.scrollTo({ top: 0 });
  }));
  $('#q').addEventListener('input', e => { state.q = e.target.value; state.view = 'journal'; render(); });
  $('#tagList').addEventListener('click', e => { const b = e.target.closest('[data-tag]'); if (b) setTag(b.dataset.tag); });

  $('#main').addEventListener('click', ev => {
    const tg = ev.target.closest('[data-tag]');
    if (tg) { ev.stopPropagation(); setTag(tg.dataset.tag); return; }
    const en = ev.target.closest('.entry');
    if (en) { openReader(en.dataset.id); return; }
    if (ev.target.closest('#promptBtn')) {
      const t = todayISO();
      const es = sorted().filter(e => e.date === t);
      es.length ? openReader(es[0].id) : openEditor(null, t);
      return;
    }
    const nb = ev.target.closest('[data-new]');
    if (nb) { openEditor(null, nb.dataset.new); return; }
    if (ev.target.closest('#clearFilter')) { state.q = ''; state.tag = null; $('#q').value = ''; render(); return; }
    const cell = ev.target.closest('.cal-cell');
    if (cell) {
      const es = sorted().filter(e => e.date === cell.dataset.date);
      es.length ? openReader(es[es.length - 1].id) : openEditor(null, cell.dataset.date);
      return;
    }
    if (ev.target.closest('#calPrev')) { if (--state.calM < 0) { state.calM = 11; state.calY--; } renderCalendar(); return; }
    if (ev.target.closest('#calNext')) { if (++state.calM > 11) { state.calM = 0; state.calY++; } renderCalendar(); return; }
    if (ev.target.closest('#calToday')) { const n = new Date(); state.calY = n.getFullYear(); state.calM = n.getMonth(); renderCalendar(); }
  });
  $('#main').addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target.classList.contains('entry')) openReader(ev.target.dataset.id);
  });

  // reader
  $('#rdClose').addEventListener('click', () => hideOverlay('#reader'));
  $('#rdEdit').addEventListener('click', () => {
    const e = state.entries.find(x => x.id === readerId);
    if (!e) return;
    hideOverlay('#reader');
    openEditor(e, null, true);
  });
  $('#readerPage').addEventListener('click', ev => {
    const tg = ev.target.closest('[data-tag]');
    if (tg) { setTag(tg.dataset.tag); return; }
    const go = ev.target.closest('[data-go]');
    if (go) openReader(go.dataset.go);
  });

  // editor
  $('#edClose').addEventListener('click', closeEditor);
  $('#edSave').addEventListener('click', saveEditor);
  $('#edDelete').addEventListener('click', () => ed.id && deleteEntry(ed.id));
  $('#edDateBtn').addEventListener('click', () => {
    const inp = $('#edDate');
    try { inp.showPicker(); }
    catch (e) { $('#edDateWrap').classList.add('fallback'); inp.focus(); }
  });
  $('#edDate').addEventListener('change', renderEdDate);
  $('#edWeather').addEventListener('click', ev => {
    const b = ev.target.closest('[data-w]');
    if (!b) return;
    ed.weather = ed.weather === b.dataset.w ? null : b.dataset.w;
    renderPickers();
  });
  $('#edMood').addEventListener('click', ev => {
    const b = ev.target.closest('[data-m]');
    if (!b) return;
    const m = +b.dataset.m;
    ed.mood = ed.mood === m ? null : m;
    renderPickers();
  });
  $('#edPhoto').addEventListener('click', ev => {
    const b = ev.target.closest('[data-ph]');
    if (!b) return;
    if (b.dataset.ph === 'remove') { ed.photo = null; renderPhoto(); }
    else $('#edPhotoFile').click();
  });
  $('#edPhotoFile').addEventListener('change', ev => { setPhoto(ev.target.files[0]); ev.target.value = ''; });
  $('#edBody').addEventListener('input', () => { autoGrow(); updateCount(); });
  $('#edTitle').addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229) { ev.preventDefault(); $('#edBody').focus(); }
  });
  const tagInput = $('#edTagInput');
  tagInput.addEventListener('keydown', ev => {
    if (ev.isComposing || ev.keyCode === 229) return;
    if (ev.key === 'Enter') { ev.preventDefault(); commitTagInput(); }
    else if (ev.key === 'Backspace' && !tagInput.value && ed.tags.length) { ed.tags.pop(); renderChips(); }
  });
  tagInput.addEventListener('input', () => { if (/[,、，]/.test(tagInput.value)) commitTagInput(); });
  tagInput.addEventListener('blur', commitTagInput);
  $('#edTagChips').addEventListener('click', ev => {
    const b = ev.target.closest('[data-rm]');
    if (b) { ed.tags.splice(+b.dataset.rm, 1); renderChips(); tagInput.focus(); }
  });
  const edEl = $('#editor');
  edEl.addEventListener('dragover', ev => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) ev.preventDefault(); });
  edEl.addEventListener('drop', ev => {
    ev.preventDefault();
    const f = [...(ev.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
    if (f) setPhoto(f);
  });
  window.addEventListener('dragover', ev => ev.preventDefault());
  window.addEventListener('drop', ev => ev.preventDefault());

  // dialog
  $('#dialogOk').addEventListener('click', () => dialogResolve && dialogResolve(true));
  $('#dialogCancel').addEventListener('click', () => dialogResolve && dialogResolve(false));
  $('#dialog').addEventListener('click', ev => { if (ev.target.id === 'dialog' && dialogResolve) dialogResolve(false); });

  // backup
  $('#exportBtn').addEventListener('click', exportData);
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', ev => { const f = ev.target.files[0]; ev.target.value = ''; if (f) importData(f); });
  $('#wipeBtn').addEventListener('click', wipeAll);

  // keyboard
  document.addEventListener('keydown', ev => {
    if (!$('#dialog').hidden) { if (ev.key === 'Escape') dialogResolve && dialogResolve(false); return; }
    if (!$('#editor').hidden) {
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); saveEditor(); }
      else if (ev.key === 'Escape') closeEditor();
      return;
    }
    if (!$('#reader').hidden) {
      const p = $('#readerPage');
      if (ev.key === 'Escape') hideOverlay('#reader');
      else if (ev.key === 'ArrowLeft' && p.dataset.older) openReader(p.dataset.older);
      else if (ev.key === 'ArrowRight' && p.dataset.newer) openReader(p.dataset.newer);
      else if (ev.key.toLowerCase() === 'e') $('#rdEdit').click();
    }
  });

  // sidebar collapse on small screens
  const mq = matchMedia('(max-width: 860px)');
  const syncMore = () => { $('#sideMore').open = !mq.matches; };
  mq.addEventListener ? mq.addEventListener('change', syncMore) : mq.addListener(syncMore);
  syncMore();
}

/* ================= init ================= */
async function init() {
  await Store.open();
  let entries = [];
  try { entries = (await Store.all()).map(normalize).filter(Boolean); } catch (e) {}
  let seeded = false;
  try { seeded = await Store.getMeta('seeded'); } catch (e) {}
  if (!entries.length && !seeded) {
    entries = seedEntries();
    try { for (const e of entries) await Store.put(e); await Store.setMeta('seeded', true); } catch (e) {}
  }
  state.entries = entries;
  bind();
  render();
  if (Store.memOnly) toast('このブラウザでは保存領域が使えないため、ページを閉じると日記が消えます。バックアップを書き出してください。', 7000);
}
init();
})();
